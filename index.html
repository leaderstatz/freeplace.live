<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Huss An Egg Bot</title>
<meta name="description" content="The official Discord bot for Huss An Egg on Roblox.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 28'%3E%3Cpath d='M11 1C5.5 1 1 9.5 1 16.5 1 22.5 5.5 27 11 27s10-4.5 10-10.5C21 9.5 16.5 1 11 1Z' fill='%23e8a33d'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f5f1;--surface:#ffffff;--text:#1d1c1a;--muted:#6a675f;--line:#e3e0d8;--accent:#d98a1c}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--surface:#1b1a18;--text:#ecebe6;--muted:#a19d94;--line:#2e2c29;--accent:#f0b552}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 16px}
.hero{max-width:520px;text-align:center}
.hero svg{width:52px;height:66px;margin-bottom:18px}
.hero path{fill:var(--accent)}
h1{font-size:40px;line-height:1.15;letter-spacing:-.015em;margin:0 0 10px}
.hero p{color:var(--muted);font-size:18px;margin:0 0 28px}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-block;padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);text-decoration:none;font-weight:600}
.btn:hover{border-color:var(--accent)}
footer{padding:20px 16px 28px;text-align:center;color:var(--muted);font-size:14px}
@media (max-width:520px){h1{font-size:32px}.hero p{font-size:17px}}
</style>
</head>
<body>
<main>
<div class="hero">
<svg viewBox="0 0 22 28" aria-hidden="true"><path d="M11 1C5.5 1 1 9.5 1 16.5 1 22.5 5.5 27 11 27s10-4.5 10-10.5C21 9.5 16.5 1 11 1Z"/></svg>
<h1>Huss An Egg Bot</h1>
<p>The official Discord bot for Huss An Egg on Roblox.</p>
<div class="links">
<a class="btn" href="terms.html">Terms of Service</a>
<a class="btn" href="privacy.html">Privacy Policy</a>
</div>
</div>
</main>
<footer>© 2026 Huss An Egg · Not affiliated with Discord or Roblox.</footer>
</body>
</html>
